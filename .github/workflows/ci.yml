name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact version on purpose: setup-uv stopped publishing
        # floating major/minor tags at v8 (supply-chain hardening), so `@v9`
        # does not exist. Bump this explicitly.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra django --extra docs --extra prod

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ examples/

      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/ examples/

      - name: Type check with pyright (informational)
        # Pre-existing Django ORM dynamism complaints; tracked separately.
        # Migrate to django-stubs and flip this back to a hard failure.
        continue-on-error: true
        run: uv run pyright src/

      - name: Run tests
        run: uv run pytest --cov=src/rakaia --cov=src/django_rakaia --cov-report=term-missing

      - name: Build docs
        run: uv run zensical build

  demos:
    # The examples are a tested surface, not a directory of prose. Every demo
    # asserts its own claims and exits non-zero when one does not hold, so this
    # job fails the moment a library change breaks a documented guarantee —
    # which is how `examples/` fell out of date before it was gated.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra django

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run every demo
        run: just demos
