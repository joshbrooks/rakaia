[project]
# Distribution name is `rakaia-streams` because `rakaia` is already taken on
# PyPI by an unrelated placeholder. The import name is unaffected:
#   pip install rakaia-streams   ->   import rakaia
name = "rakaia-streams"
version = "0.2.0"
description = "Python server implementation of the Durable Streams protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Josh Brooks" }]
keywords = ["durable-streams", "streaming", "http", "sse", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# Zero runtime dependencies - pure ASGI, stdlib only
dependencies = []

[project.urls]
Homepage = "https://github.com/joshbrooks/rakaia"
Repository = "https://github.com/joshbrooks/rakaia"
Issues = "https://github.com/joshbrooks/rakaia/issues"
Changelog = "https://github.com/joshbrooks/rakaia/blob/main/CHANGELOG.md"

[project.optional-dependencies]
django = [
    "django>=4.2.0",
    "daphne>=4.2.1",
    "channels>=4.0",
]
prod = [
    "channels-redis>=4.1.0",
    "hypercorn>=0.17.0",
    "whitenoise>=6.0",
]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "django>=4.2",
    "django-types>=0.23.0",
    "pytest-django>=4.9.0",
]
docs = [
    "zensical>=0.0.51",
    "markdown>=3.10.2",
    "pymdown-extensions>=11.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Keep everyone on one uv minor, so `uv.lock` is not rewritten in a newer
# serialisation style by whoever happens to run `uv sync` next. A version bump
# once carried a few hundred lines of unrelated dependency-marker churn purely
# because CI ran a newer uv than the author (#118). CI pins the same version in
# every workflow; this is the local half, and it refuses rather than rewrites.
required-version = ">=0.9.22,<0.10"

[tool.hatch.build.targets.wheel]
packages = ["src/rakaia", "src/django_rakaia"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from in except
    "SIM108", # use ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["rakaia", "django_rakaia"]

[tool.pyright]
pythonVersion = "3.10"
# `standard` (the pyright default) catches genuine type errors but is
# tolerant of Django ORM dynamism that pyright can't introspect. Set this
# to `strict` if you want to enforce full annotation coverage on the core
# rakaia package.
typeCheckingMode = "standard"
include = ["src"]
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
DJANGO_SETTINGS_MODULE = "tests.test_django_rakaia.settings"
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
]

